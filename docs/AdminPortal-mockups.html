<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stockroom Admin — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --teal:#124559;--teal-side:#0f3d4c;--amber:#E8890C;--deal:#B5670A;
    --ink:#1A1D21;--slate:#64707D;--bg:#F4F6F8;--surface:#fff;--border:#E4E8EC;
    --instock:#1F8A4C;--low:#C77700;--out:#98A2AF;--red:#C0392B;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 20px rgba(20,30,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .app{display:flex;min-height:100vh;}

  /* ---------- sidebar ---------- */
  .side{width:230px;flex:0 0 230px;background:var(--teal-side);color:#bcd3da;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:17px 18px 14px;}
  .brand .m{width:30px;height:30px;border-radius:8px;background:var(--amber);display:flex;align-items:center;justify-content:center;}
  .brand .t{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em;}
  .nav{display:flex;flex-direction:column;padding-bottom:20px;}
  .nav .lnk{display:flex;align-items:center;gap:11px;padding:9px 18px;font-size:13px;color:#9fbcc4;font-weight:500;cursor:pointer;user-select:none;border-left:3px solid transparent;}
  .nav .lnk:hover{color:#fff;}
  .nav .lnk svg{flex:0 0 auto;stroke:currentColor;}
  .nav .lnk.on{background:rgba(255,255,255,.10);color:#fff;border-left-color:var(--amber);}
  .nav .lnk .chev{margin-left:auto;transition:transform .15s;}
  .nav .grp.open .chev{transform:rotate(90deg);}
  .nav .sub{display:none;flex-direction:column;background:rgba(0,0,0,.14);}
  .nav .sub.open{display:flex;}
  .nav .sub .lnk{padding-left:46px;font-size:12.5px;color:#8fb0b9;}
  .nav .sub .lnk.on{color:#fff;background:rgba(255,255,255,.08);}

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{height:58px;flex:0 0 58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5;}
  .topbar .ttl{font-size:17px;font-weight:600;letter-spacing:-.01em;}
  .topbar .rt{display:flex;align-items:center;gap:14px;}
  .who{display:flex;align-items:center;gap:9px;}
  .ava{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
  .who .nm{font-size:12.5px;font-weight:600;}
  .who .rl{font-size:11px;color:var(--slate);}
  .content{padding:22px 24px 60px;}
  .page{display:none;}
  .page.on{display:block;}

  /* ---------- headers ---------- */
  .phead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .phead h1{font-size:21px;font-weight:700;letter-spacing:-.01em;}
  .phead .sub{font-size:13px;color:var(--slate);margin-top:4px;}
  .phead .acts{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- buttons ---------- */
  .btn{border:none;border-radius:8px;font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn.teal{background:var(--teal);color:#fff;}
  .btn.amber{background:var(--amber);color:#3a2400;}
  .btn.ghost{background:#fff;border:1px solid var(--border);color:var(--ink);}
  .btn.red{background:#fff;border:1px solid #ecc9c4;color:var(--red);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .btn.link{background:none;color:var(--teal);padding:4px 2px;}
  .iconbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .iconbtn:hover{background:var(--bg);}

  /* ---------- toolbar (search/filters) ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .search{background:#fff;border:1px solid var(--border);border-radius:9px;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;min-width:220px;}
  .search input{border:none;outline:none;font-family:inherit;font-size:13px;flex:1;background:none;color:var(--ink);}
  select.sel{height:38px;border:1px solid var(--border);border-radius:9px;background:#fff;font-family:inherit;font-size:12.5px;color:var(--ink);padding:0 10px;cursor:pointer;}

  /* ---------- cards & tables ---------- */
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
  .card .ch{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .tbl{width:100%;border-collapse:collapse;}
  .tbl th{font-size:11px;color:var(--slate);text-align:left;padding:10px 14px;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;background:#fafbfc;}
  .tbl td{font-size:12.5px;padding:11px 14px;border-bottom:1px solid #EFF2F4;vertical-align:middle;white-space:nowrap;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl tbody tr:hover{background:#fafbfc;}
  .tbl .sub{font-size:11px;color:var(--slate);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .mono{font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  .rowlow{background:#FEF7EC;}
  .rowlow:hover{background:#FDF1DE;}

  .pill{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-block;white-space:nowrap;}
  .p-active{background:#E4F3EA;color:var(--instock);}
  .p-inactive{background:#F1F3F5;color:var(--slate);}
  .p-draft{background:#EEF1F3;color:var(--teal);}
  .p-low{background:#FBEEDD;color:var(--low);}
  .p-pending{background:#FBEEDD;color:var(--low);}
  .p-received{background:#E4F3EA;color:var(--instock);}
  .p-partial{background:#FBEEDD;color:var(--low);}
  .p-paid{background:#E4F3EA;color:var(--instock);}
  .p-cancelled{background:#F1F3F5;color:var(--slate);}
  .p-placed{background:#EAF0F2;color:var(--teal);}
  .p-prep{background:#FBEEDD;color:var(--low);}
  .p-ship{background:#E4F3EA;color:var(--instock);}
  .p-unpaid{background:#F1F3F5;color:var(--slate);}
  .p-new{background:#EAF0F2;color:var(--teal);}
  .p-match{background:#E4F3EA;color:var(--instock);}
  .p-warn{background:#FBE9E7;color:var(--red);}
  .p-ready{background:#E4F3EA;color:var(--instock);}
  .p-review{background:#FBEEDD;color:var(--low);}
  .p-danger{background:#FBE9E7;color:#C0392B;}
  .p-info{background:#EAF0F2;color:var(--teal);}
  .tline .ev{position:relative;padding:0 0 14px 16px;border-left:2px solid var(--border);margin-left:3px;}
  .tline .ev:last-child{border-left-color:transparent;padding-bottom:0;}
  .tline .ev::before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 1px var(--border);}
  .tline .ev .tx{font-size:12.5px;line-height:1.45;}
  .tline .ev .mt{font-size:11px;color:var(--slate);margin-top:2px;}
  .warnbar{background:#FBE9E7;border:1px solid #F3D3CE;color:#8a2c22;border-radius:10px;padding:11px 14px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start;margin-bottom:14px;}
  .warnbar svg{flex:0 0 auto;margin-top:1px;}
  .sumrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
  .sumrow .lbl{color:var(--slate);}
  .sumrow.big{font-size:16px;font-weight:700;padding-top:10px;border-top:1px solid var(--border);color:var(--ink);}
  .acctbox{font-size:12px;line-height:1.7;}
  .acctbox .lbl{color:var(--slate);}
  .miniq{width:52px;border:1px solid var(--teal);border-radius:6px;padding:5px 6px;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;}
  .taberow{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tabpill{font-size:12.5px;padding:7px 13px;border-radius:8px;background:#fff;border:1px solid var(--border);color:var(--slate);font-weight:500;cursor:pointer;}
  .tabpill.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .statgrp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:12.5px;}
  .kv .k{color:var(--slate);}

  .neg{color:var(--red);font-weight:600;}
  .pos{color:var(--instock);font-weight:600;}
  .marginbad{color:var(--red);font-weight:700;}

  .pager{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:12px;color:var(--slate);border-top:1px solid var(--border);}
  .pager .pg{display:flex;gap:5px;}
  .pager .pg button{border:1px solid var(--border);background:#fff;border-radius:6px;min-width:30px;height:30px;font-family:inherit;font-size:12px;cursor:pointer;color:var(--ink);}
  .pager .pg button.on{background:var(--teal);color:#fff;border-color:var(--teal);}

  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px;}
  .stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);}
  .stat .k{font-size:12px;color:var(--slate);}
  .stat .v{font-size:26px;font-weight:700;margin-top:8px;letter-spacing:-.02em;}
  .stat .d{font-size:11.5px;margin-top:3px;color:var(--slate);}
  .stat .d.warn{color:var(--low);font-weight:600;}
  .summ{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
  .sc{background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 15px;}
  .sc .n{font-size:21px;font-weight:700;}
  .sc .l{font-size:11px;color:var(--slate);margin-top:3px;}
  .sc.g{border-color:#BFE3CC;background:#F2FAF5;} .sc.g .n{color:var(--instock);}
  .sc.b{border-color:#CFE0EC;background:#F1F7FB;} .sc.b .n{color:var(--teal);}
  .sc.r{border-color:#F3D3CE;background:#FDF3F1;} .sc.r .n{color:var(--red);}
  .sc.a{border-color:#F3DEBE;background:#FDF7EE;} .sc.a .n{color:var(--low);}

  /* forms */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .chartgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px;}
  .chcard{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;}
  .chcard .ct{font-size:13.5px;font-weight:600;margin-bottom:2px;}
  .chcard .cs{font-size:11.5px;color:var(--slate);margin-bottom:12px;}
  .chwrap{position:relative;height:230px;}
  .stat .delta{font-size:11.5px;font-weight:600;margin-top:4px;display:inline-flex;align-items:center;gap:3px;}
  .stat .delta.up{color:var(--instock);} .stat .delta.down{color:var(--red);}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .fld{margin-bottom:14px;}
  .fld label{display:block;font-size:12px;font-weight:500;color:var(--slate);margin-bottom:6px;}
  .fld label .req{color:var(--red);}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff;outline:none;}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--teal);}
  .fld input.err{border-color:var(--red);background:#fdf3f1;}
  .fld .hint{font-size:11px;color:var(--slate);margin-top:5px;}
  .fld .errmsg{font-size:11px;color:var(--red);margin-top:5px;display:none;}
  .fld input.err ~ .errmsg{display:block;}
  .readonly{background:#F4F6F8 !important;color:var(--slate);}
  .fsect{font-size:13px;font-weight:700;margin:6px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .marginout{font-size:19px;font-weight:700;}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;}
  .toggle{width:40px;height:22px;border-radius:12px;background:var(--instock);position:relative;cursor:pointer;}
  .toggle::after{content:"";position:absolute;top:2px;left:20px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
  .toggle.off{background:#C4CBD2;}
  .toggle.off::after{left:2px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,25,32,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;}
  .overlay.on{display:flex;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);}
  .modal.wide{max-width:900px;}
  .modal.slim{max-width:460px;}
  .mhead{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .mhead h3{font-size:16px;font-weight:700;}
  .mhead .x{cursor:pointer;color:var(--slate);font-size:22px;line-height:1;}
  .mbody{padding:20px;}
  .mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;}

  /* toast */
  .toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:9px;z-index:80;}
  .toast{background:#0f3d4c;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:9px;animation:slidein .2s ease;}
  .toast.ok{background:#1F8A4C;}
  .toast.warn{background:var(--low);}
  @keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* wizard */
  .wsteps{display:flex;align-items:center;gap:9px;margin-bottom:20px;font-size:12.5px;flex-wrap:wrap;}
  .wsteps .s{display:flex;align-items:center;gap:8px;color:var(--slate);}
  .wsteps .s .n{width:24px;height:24px;border-radius:50%;background:#E4E8EC;color:var(--slate);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .wsteps .s.on{color:var(--ink);font-weight:600;}
  .wsteps .s.on .n{background:var(--teal);color:#fff;}
  .wsteps .s.done .n{background:var(--instock);color:#fff;}
  .wsteps .ln{width:34px;height:2px;background:var(--border);}
  .wstep{display:none;} .wstep.on{display:block;}
  .drop{border:1.5px dashed #C7D0D7;border-radius:12px;padding:34px;text-align:center;color:var(--slate);background:#fff;}
  .drop svg{opacity:.5;margin-bottom:10px;}
  .vendorbox{background:#F1F7FB;border:1px solid #CFE0EC;border-radius:10px;padding:14px 16px;font-size:12.5px;line-height:1.7;}
  .filechip{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:14px;}
  .filechip .fi{width:36px;height:36px;border-radius:8px;background:#E4F3EA;display:flex;align-items:center;justify-content:center;}

  .flag{font-size:10.5px;color:var(--red);font-weight:600;}
  .twocol{display:grid;grid-template-columns:1.3fr .8fr;gap:16px;align-items:start;}
  @media(max-width:900px){.stats,.summ{grid-template-columns:repeat(2,1fr)}.grid2,.twocol,.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="side">
    <div class="brand"><div class="m"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-5 9 5v9a1 1 0 01-1 1h-4v-6H8v6H4a1 1 0 01-1-1V9z" stroke="#3a2400" stroke-width="1.8" stroke-linejoin="round"/></svg></div><div class="t">Stockroom</div></div>
    <nav class="nav" id="nav">
      <div class="lnk on" data-page="dashboard"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke-width="1.6"/></svg>Dashboard</div>

      <div class="lnk grp" data-group="catalog"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 8l8-4 8 4-8 4z" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 8v8l8 4 8-4V8" stroke-width="1.6" stroke-linejoin="round"/></svg>Catalog<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="sub" id="sub-catalog">
        <div class="lnk" data-page="catalog">All Items</div>
        <div class="lnk" data-page="additem">Add New Item</div>
        <div class="lnk" data-page="inventory">Inventory / Stock</div>
        <div class="lnk" data-page="quickcomplete">Imported Items</div>
      </div>

      <div class="lnk grp" data-group="purchasing"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="1" y="6" width="13" height="10" rx="1.5" stroke-width="1.6"/><path d="M14 9h4l3 3v4h-7z" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6" cy="18" r="1.8" stroke-width="1.6"/><circle cx="17" cy="18" r="1.8" stroke-width="1.6"/></svg>Purchasing<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="sub" id="sub-purchasing">
        <div class="lnk" data-page="pos">Purchase Orders</div>
        <div class="lnk" data-page="createpo">Create Purchase Order</div>
        <div class="lnk" data-page="importpo">Import PO From Excel</div>
        <div class="lnk" data-page="vendors">Vendors</div>
      </div>

      <div class="lnk grp" data-group="sales"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M5 7h14l-1 13H6z" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 7a3 3 0 016 0" stroke-width="1.6"/></svg>Sales<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="sub" id="sub-sales">
        <div class="lnk" data-page="customers">Customers</div>
        <div class="lnk" data-page="orders">Orders</div>
        <div class="lnk" data-page="invoices">Invoices</div>
      </div>

      <div class="lnk grp" data-group="settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke-width="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke-width="1.6" stroke-linecap="round"/></svg>Settings<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="sub" id="sub-settings">
        <div class="lnk" data-page="users">Users</div>
        <div class="lnk" data-page="company">Company Details</div>
      </div>
    </nav>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <div class="topbar"><div class="ttl" id="topttl">Dashboard</div><div class="rt"><div class="who"><div class="ava">AM</div><div><div class="nm">Amir M.</div><div class="rl">Owner</div></div></div></div></div>
    <div class="content" id="content"><!-- pages injected --></div>
  </main>
</div>

<div class="overlay" id="overlay"><div id="modalhost"></div></div>
<div class="toasts" id="toasts"></div>

<script>
/* ============================================================ DATA */
const money = n => '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const marginPct = (price,cost) => price>0 ? (((price-cost)/price)*100) : 0;

const $ = s => document.querySelector(s);
const host = () => $('#content');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+esc(msg);$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200);}
function openModal(html,wide){$('#modalhost').innerHTML='<div class="modal '+(wide||'')+'">'+html+'</div>';$('#overlay').classList.add('on');}
function closeModal(){$('#overlay').classList.remove('on');$('#modalhost').innerHTML='';}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});

function statusPill(s){
  const map={'Active':'p-active','Inactive':'p-inactive','Draft':'p-draft','Low Stock':'p-low','Pending':'p-pending','Received':'p-received','Partially Received':'p-partial','Paid':'p-paid','Cancelled':'p-cancelled','Placed':'p-placed','Preparing':'p-prep','Shipped':'p-ship','Scheduled':'p-draft','Ended':'p-inactive','Needs Review':'p-review','Ready to Publish':'p-ready',
  'Submitted':'p-info','Confirmed':'p-info','On Hold':'p-low','Closed':'p-active',
  'Unfulfilled':'p-inactive','Partially Fulfilled':'p-partial','Fulfilled':'p-active','Backordered':'p-danger','Ready for Pickup':'p-info','Delivered':'p-active',
  'Not Invoiced':'p-inactive','Partially Invoiced':'p-partial','Fully Invoiced':'p-active','Open':'p-info','Sent':'p-info','Partially Paid':'p-partial','Overdue':'p-danger','Void':'p-cancelled','Credited':'p-cancelled',
  'Unpaid':'p-unpaid','Refunded':'p-cancelled','Settled':'p-ship',
  'Not Sent':'p-inactive','Queued':'p-low','Failed':'p-danger',
  'Pending Approval':'p-pending','Good':'p-active','Watch':'p-low','Hold':'p-danger','N/A':'p-inactive'};
  return '<span class="pill '+(map[s]||'p-inactive')+'">'+esc(s)+'</span>';
}
function payPill(s){return '<span class="pill '+(s==='Settled'||s==='Paid'?'p-ship':'p-unpaid')+'">'+esc(s)+'</span>';}

function nav(page){
  document.querySelectorAll('#nav .lnk').forEach(l=>l.classList.toggle('on',l.dataset.page===page));
  // open the parent submenu
  const inCatalog=['catalog','additem','promotions','inventory','quickcomplete'].includes(page);
  const inPurch=['pos','createpo','importpo','vendors'].includes(page);
  const inSales=['customers','orders','invoices'].includes(page);
  const inSettings=['users','company'].includes(page);
  toggleSub('catalog',inCatalog); toggleSub('purchasing',inPurch); toggleSub('sales',inSales); toggleSub('settings',inSettings);
  $('#topttl').textContent=TITLES[page]||'';
  RENDER[page]();
  window.scrollTo(0,0);
}
function toggleSub(g,open){
  const sub=$('#sub-'+g), grp=document.querySelector('[data-group="'+g+'"]');
  if(open){sub.classList.add('open');grp.classList.add('open','on');}
  else {sub.classList.remove('open');grp.classList.remove('on');grp.classList.remove('open');}
}
document.querySelectorAll('#nav .lnk').forEach(l=>{
  l.addEventListener('click',()=>{
    if(l.dataset.group){const s=$('#sub-'+l.dataset.group);const isOpen=s.classList.contains('open');s.classList.toggle('open',!isOpen);l.classList.toggle('open',!isOpen);return;}
    if(l.dataset.page)nav(l.dataset.page);
  });
});

let catFilters={q:'',dept:'',vendor:'',status:'',low:false,page:1};
RENDER.catalog=()=>{
  host().innerHTML=`
  <div class="phead"><div><h1>Catalog</h1><div class="sub">Manage products, pricing, inventory, and supplier information</div></div>
    <div class="acts"><button class="btn ghost sm" onclick="nav('importpo')">Import Items</button><button class="btn ghost sm" onclick="exportCSV('catalog')">Export to Excel</button><button class="btn teal" onclick="nav('additem')">+ Add New Item</button></div>
  </div>
  <div class="toolbar">
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#64707D" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="#64707D" stroke-width="1.8" stroke-linecap="round"/></svg><input id="catq" placeholder="Search name or UPC" value="${catFilters.q}"></div>
    <select class="sel" id="catdept"><option value="">All departments</option>${DEPTS.map(d=>`<option ${catFilters.dept===d?'selected':''}>${d}</option>`).join('')}</select>
    <select class="sel" id="catvendor"><option value="">All vendors</option>${VENDORS.map(v=>`<option value="${v.id}" ${catFilters.vendor===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select>
    <select class="sel" id="catstatus"><option value="">Any status</option><option ${catFilters.status==='Active'?'selected':''}>Active</option><option ${catFilters.status==='Inactive'?'selected':''}>Inactive</option><option ${catFilters.status==='Draft'?'selected':''}>Draft</option><option ${catFilters.status==='Low Stock'?'selected':''}>Low Stock</option></select>
    <label class="switch"><input type="checkbox" id="catlow" ${catFilters.low?'checked':''}> Low stock only</label>
  </div>
  <div class="card"><div style="overflow-x:auto"><table class="tbl" id="cattbl"></table></div><div id="catpager"></div></div>`;
  ['catq','catdept','catvendor','catstatus','catlow'].forEach(id=>{const e=$('#'+id);e.addEventListener('input',()=>{catFilters.q=$('#catq').value;catFilters.dept=$('#catdept').value;catFilters.vendor=$('#catvendor').value;catFilters.status=$('#catstatus').value;catFilters.low=$('#catlow').checked;catFilters.page=1;drawCat();});});
  drawCat();
};
function catData(){return ITEMS.filter(i=>{
  if(catFilters.q){const q=catFilters.q.toLowerCase();if(!(i.name.toLowerCase().includes(q)||i.upc.toLowerCase().includes(q)))return false;}
  if(catFilters.dept&&i.dept!==catFilters.dept)return false;
  if(catFilters.vendor&&i.vid!==catFilters.vendor)return false;
  if(catFilters.status&&i.status!==catFilters.status)return false;
  if(catFilters.low&&i.status!=='Low Stock')return false;
  return true;});}
function drawCat(){
  const data=catData();const per=6;const pages=Math.max(1,Math.ceil(data.length/per));if(catFilters.page>pages)catFilters.page=pages;
  const rows=data.slice((catFilters.page-1)*per,catFilters.page*per);
  $('#cattbl').innerHTML=`<tr><th>UPC</th><th>Item Name</th><th>Department</th><th>Size</th><th class="num">Qty</th><th class="num">Cost</th><th class="num">Price</th><th class="num">Margin</th><th>Vendor Code</th><th>Last Purch.</th><th>Status</th><th>Action</th></tr>`+
    (rows.length?rows.map((i,idx)=>{const gi=ITEMS.indexOf(i);const m=marginPct(i.price,i.cost);const low=i.status==='Low Stock';
    return `<tr class="${low?'rowlow':''}"><td class="mono sub">${esc(i.upc)}</td><td><b>${esc(i.name)}</b>${i.hotDeal?' <span class="pill p-low" style="font-size:9.5px;vertical-align:middle">Hot Deal</span>':''}</td><td>${esc(i.dept)}</td><td class="sub">${esc(i.size)}</td><td class="num ${low?'neg':''}">${i.qty}</td><td class="num">${money(i.cost)}</td><td class="num">${i.price?money(i.price):'—'}</td><td class="num ${m<0?'marginbad':''}">${i.price?mpFmt(m):'—'}</td><td class="sub">${esc(i.vcode)}</td><td class="sub">${esc(i.last)}</td><td>${statusPill(i.status)}</td>
      <td><span class="iconbtn" title="Edit" onclick="editItem(${gi})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18 10l-4-4L4 16z" stroke="#124559" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
      <span class="iconbtn" title="Toggle active" onclick="toggleItem(${gi})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v9" stroke="#64707D" stroke-width="1.7" stroke-linecap="round"/><path d="M6 6a8 8 0 1012 0" stroke="#64707D" stroke-width="1.7" stroke-linecap="round"/></svg></span></td></tr>`;}).join('')
    :`<tr><td colspan="12" style="text-align:center;color:var(--slate);padding:30px">No items match your filters.</td></tr>`);
  $('#catpager').innerHTML=`<div class="pager"><span>${data.length} item(s)</span><div class="pg">${Array.from({length:pages},(_,p)=>`<button class="${p+1===catFilters.page?'on':''}" onclick="catFilters.page=${p+1};drawCat()">${p+1}</button>`).join('')}</div></div>`;
}
function toggleItem(gi){const i=ITEMS[gi];i.status=i.status==='Inactive'?'Active':'Inactive';toast(i.name+' set '+i.status);drawCat();}
function editItem(gi){nav('additem');setTimeout(()=>fillItemForm(ITEMS[gi]),20);}

function recalcItemMargin(){const c=parseFloat($('#i_cost').value)||0,p=parseFloat($('#i_price').value)||0;const el=$('#i_margin');if(p>0){const m=marginPct(p,c);el.textContent=mpFmt(m);el.className='marginout '+(m<0?'marginbad':'');}else{el.textContent='—';el.className='marginout';}}
function genUpc(){const base='2'+Math.floor(100000000000+Math.random()*899999999999).toString().slice(0,11);$('#i_upc').value=base.replace(/(.)(.{5})(.{5})(.)/,'$1 $2 $3 $4');toast('Generated in-store UPC','ok');}
function fillItemForm(it){$('#aititle').textContent='Edit item';$('#i_upc').value=it.upc;$('#i_name').value=it.name;$('#i_dept').value=it.dept;$('#i_size').value=it.size;$('#i_status').value=it.status==='Draft'?'Inactive':it.status;$('#i_cost').value=it.cost;$('#i_price').value=it.price||'';$('#i_qty').value=it.qty;$('#i_vcode').value=it.vcode;$('#i_vid').value=it.vid;$('#i_last').value=it.last!=='—'?it.last:'';$('#i_hot').classList.toggle('off',!it.hotDeal);if(it.rail)$('#i_rail').value=it.rail;$('#i_was').value=it.wasPrice||'';recalcItemMargin();}
function saveItem(mode){
  const name=$('#i_name').value.trim(),cost=parseFloat($('#i_cost').value),price=parseFloat($('#i_price').value);
  let ok=true;const ne=$('#i_name');if(!name){ne.classList.add('err');ok=false;}else ne.classList.remove('err');
  if(mode==='Active'&&(isNaN(cost)||isNaN(price))){toast('Cost and Price are required to publish','warn');ok=false;}
  if(!ok)return;
  ITEMS.unshift({upc:$('#i_upc').value||'—',name,dept:$('#i_dept').value,size:$('#i_size').value||'Each',qty:parseInt($('#i_qty').value)||0,cost:cost||0,price:price||0,vcode:$('#i_vcode').value||'—',vid:$('#i_vid').value,last:$('#i_last').value||'—',hotDeal:!$('#i_hot').classList.contains('off'),rail:$('#i_rail').value,wasPrice:parseFloat($('#i_was').value)||null,status:mode==='Draft'?'Draft':'Active'});
  toast('Item saved'+(mode==='Draft'?' as draft':''),'ok');nav('catalog');
}

function completeReceive(grn){const p=POS[curPo];const rl=[];

    <td class="num"><input class="miniq" type="number" step="0.01" value="${l.disc}" onchange="ORDERS[curOrder].lines[${i}].disc=parseFloat(this.value)||0;drawOrderLines()"></td>
    <td class="num sub">${money(l.tax||0)}</td><td class="num">${money(lt)}</td><td>${act}</td></tr>`;}).join('');
  const t=orderTotals(o);recalcFul(o);recalcInv(o);
  $('#od_tot').innerHTML=`<div class="sumrow"><span class="lbl">Subtotal</span><b>${money(t.sub)}</b></div><div class="sumrow"><span class="lbl">Discounts</span><b>−${money(t.disc)}</b></div><div class="sumrow"><span class="lbl">Tax</span><b>${money(t.tax)}</b></div><div class="sumrow"><span class="lbl">Shipping</span><b>${money(t.ship)}</b></div><div class="sumrow big"><span>Order Total</span><span>${money(t.total)}</span></div>`;
  const fh=$('#od_ful');if(fh)fh.innerHTML=o.fulfillments.length?o.fulfillments.map(f=>`<div style="font-size:12px;margin-bottom:8px"><b>${f.fno}</b> · ${f.date} · ${esc(f.wh)}<div class="sub">${f.lines.map(x=>esc(x.name)+' ×'+x.qty).join(', ')}</div></div>`).join(''):'<div class="sub" style="font-size:12px">No fulfilments yet.</div>';
}
function editOrdQty(i,val){const o=ORDERS[curOrder];const l=o.lines[i];let v=parseFloat(val)||0;if(v<l.qtyInv){toast('Cannot reduce below invoiced qty ('+l.qtyInv+'). Use a credit memo.','warn');v=l.qtyInv;}l.qtyOrd=v;drawOrderLines();}
function editOrdPrice(i,val){const o=ORDERS[curOrder];const l=o.lines[i];const old=l.price;const nv=parseFloat(val)||0;if(nv!==old){l.price=nv;l.edited=true;l.overrideBy='Amir M.';o.timeline.push({when:'2026-09-11',who:'Amir M.',text:'Price on '+l.name+' changed from '+money(old)+' to '+money(nv)+'.'});}drawOrderLines();}
function priceReason(i){openModal('<div class="mhead"><h3>Reason for price override</h3><span class="x" onclick="closeModal()">&times;</span></div><div class="mbody"><div class="fld"><label>Reason (required for audit)</label><input id="pr_r" placeholder="e.g. Customer contract pricing"></div></div><div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn teal" onclick="savePriceReason('+i+')">Save reason</button></div>','slim');}
function savePriceReason(i){const r=$('#pr_r').value||'—';const o=ORDERS[curOrder];o.lines[i].overrideReason=r;o.timeline.push({when:'2026-09-11',who:'Amir M.',text:'Override reason for '+o.lines[i].name+': '+r});closeModal();toast('Reason saved','ok');drawOrderLines();}
function removeOrdLine(i){const o=ORDERS[curOrder];const l=o.lines[i];if(l.qtyInv>0){toast('Line already invoiced — cannot remove','warn');return;}openModal('<div class="mhead"><h3>Remove '+esc(l.name)+'?</h3><span class="x" onclick="closeModal()">&times;</span></div><div class="mbody">Remove this line from order '+o.no+'?</div><div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn red" onclick="doRemoveOrdLine('+i+')">Remove</button></div>','slim');}
function doRemoveOrdLine(i){const o=ORDERS[curOrder];const nm=o.lines[i].name;o.lines.splice(i,1);o.timeline.push({when:'2026-09-11',who:'Amir M.',text:'Removed '+nm+' from the order.'});closeModal();toast('Line removed');drawOrderLines();}
function logPhone(){openModal('<div class="mhead"><h3>Log order change</h3><span class="x" onclick="closeModal()">&times;</span></div><div class="mbody"><div class="fld"><label>Note (added to the audit trail)</label><input id="lp_n" placeholder="e.g. Customer called and added 6 cases of Spring Water"></div></div><div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn teal" onclick="saveLogPhone()">Add to timeline</button></div>','slim');}
function saveLogPhone(){const n=$('#lp_n').value||'Change logged';ORDERS[curOrder].timeline.push({when:'2026-09-11',who:'Amir M.',text:'Customer requested by phone: '+n});closeModal();toast('Logged to timeline','ok');orderDetail(curOrder);}
function addOrderItem(){openModal('<div class="mhead"><h3>Add item to order</h3><span class="x" onclick="closeModal()">&times;</span></div><div class="mbody"><div class="search" style="margin-bottom:12px">'+SICON+'<input id="ai_q" placeholder="Search catalog by name, UPC, SKU" oninput="drawAddItems()"></div><div style="max-height:340px;overflow:auto"><table class="tbl" id="ai_tbl"></table></div></div>','wide');drawAddItems();}
function drawAddItems(){const q=($('#ai_q').value||'').toLowerCase();const rows=ITEMS.filter(it=>it.status!=='Draft'&&(!q||(it.name+' '+it.upc+' '+it.vcode).toLowerCase().includes(q))).slice(0,20);$('#ai_tbl').innerHTML='<tr><th>Item</th><th>UPC</th><th class="num">Price</th><th class="num">Avail</th><th></th></tr>'+rows.map(it=>{const gi=ITEMS.indexOf(it);return '<tr><td><b>'+esc(it.name)+'</b><div class="sub">'+esc(it.dept)+'</div></td><td class="mono sub">'+esc(it.upc)+'</td><td class="num">'+money(it.price)+'</td><td class="num sub">'+it.qty+'</td><td><button class="btn ghost sm" onclick="addOrderLine('+gi+')">Add</button></td></tr>';}).join('');}
function addOrderLine(gi){const it=ITEMS[gi];const o=ORDERS[curOrder];o.lines.push({upc:it.upc,sku:it.vcode,name:it.name,dept:it.dept,qtyOrd:1,qtyFul:0,qtyInv:0,qtyBack:0,avail:it.qty,price:it.price,disc:0,tax:0});o.timeline.push({when:'2026-09-11',who:'Amir M.',text:'Added '+it.name+' to the order.'});closeModal();toast(it.name+' added','ok');orderDetail(curOrder);}

function fulfillItems(){const o=ORDERS[curOrder];const c=custById(o.custId);
  if(c&&c.status==='On Hold'){toast('Account on hold — cannot fulfil','warn');return;}
  const fno='FUL-'+(3302+o.fulfillments.length+Math.floor(Math.random()*8));
  const rows=o.lines.map((l,i)=>({i,l,rem:l.qtyOrd-l.qtyFul,canf:Math.min(l.avail,l.qtyOrd-l.qtyFul)})).filter(r=>r.rem>0);
  if(!rows.length){toast('Nothing left to fulfil','warn');return;}
  openModal(`<div class="mhead"><h3>Fulfill Order ${o.no}</h3><span class="x" onclick="closeModal()">&times;</span></div>
  <div class="mbody">
    <div class="grid3"><div class="fld"><label>Fulfillment #</label><input class="readonly" readonly value="${fno}"></div><div class="fld"><label>Date</label><input type="date" value="2026-09-11"></div><div class="fld"><label>Warehouse</label><select><option>Main Warehouse</option><option>Overflow Depot</option></select></div></div>
    <div class="grid3"><div class="fld"><label>Method</label><select><option>Delivery</option><option>Pickup</option><option>Courier</option></select></div><div class="fld"><label>Tracking #</label><input placeholder="Optional"></div><div class="fld"><label>Packing notes</label><input placeholder="Optional"></div></div>
    <div style="overflow-x:auto"><table class="tbl"><tr><th>Item</th><th class="num">Ordered</th><th class="num">Prev</th><th class="num">Available</th><th class="num">Fulfill Now</th><th class="num">Remaining</th><th>Balance</th></tr>
    ${rows.map(r=>`<tr><td><b>${esc(r.l.name)}</b>${r.l.avail<r.rem?'<div class="flag">insufficient stock</div>':''}</td><td class="num">${r.l.qtyOrd}</td><td class="num">${r.l.qtyFul}</td><td class="num">${r.l.avail}</td><td class="num"><input class="miniq" id="ff_${r.i}" type="number" value="${r.canf}" onchange="ffRem(${r.i},${r.rem})"></td><td class="num" id="fr_${r.i}">${r.rem-r.canf}</td><td><select class="sel" style="height:32px" id="fb_${r.i}"><option>Backorder</option><option>Cancel balance</option><option>Substitute</option><option>Awaiting customer</option></select></td></tr>`).join('')}
    </table></div>
    <div class="hint" style="font-size:11.5px;color:var(--slate);margin-top:10px">Fulfil now defaults to available (capped at remaining). Set the balance action for anything short-shipped.</div>
  </div>
  <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ghost" onclick="toast('Saved as draft fulfilment','ok');closeModal()">Save Draft</button><button class="btn ghost" onclick="completeFulfill('${fno}',false)">Complete Fulfillment</button><button class="btn teal" onclick="completeFulfill('${fno}',true)">Complete + Invoice</button></div>`,'wide');
}
function ffRem(i,rem){let v=Math.min(parseFloat($('#ff_'+i).value)||0,rem);if(v<0)v=0;$('#ff_'+i).value=v;$('#fr_'+i).textContent=rem-v;}
function completeFulfill(fno,withInv){const o=ORDERS[curOrder];const fl=[];
  o.lines.forEach((l,i)=>{const inp=$('#ff_'+i);if(!inp)return;let q=Math.min(parseFloat(inp.value)||0,l.qtyOrd-l.qtyFul);if(q<=0)return;const bal=$('#fb_'+i)?$('#fb_'+i).value:'Backorder';l.qtyFul+=q;l.avail=Math.max(0,l.avail-q);const rem=l.qtyOrd-l.qtyFul;if(rem>0&&bal==='Backorder')l.qtyBack=rem;if(rem>0&&bal==='Cancel balance'){l.qtyOrd=l.qtyFul;l.qtyBack=0;}fl.push({name:l.name,qty:q});});
  if(!fl.length){toast('Enter a quantity to fulfil','warn');return;}
  o.fulfillments.push({fno,date:'2026-09-11',wh:'Main Warehouse',method:'Delivery',tracking:'',lines:fl});
  recalcFul(o);if(o.status==='Submitted')o.status='Confirmed';
  o.timeline.push({when:'2026-09-11',who:'Warehouse',text:fno+': fulfilled '+fl.map(x=>x.name+' ×'+x.qty).join(', ')+'. Status now '+o.fstatus+'.'});
  closeModal();toast('Fulfilment '+fno+' completed','ok');
  if(withInv){createOrderInvoice(true);}else{orderDetail(curOrder);}
}
function createOrderInvoice(auto){const o=ORDERS[curOrder];const inv=o.lines.map(l=>({l,q:l.qtyFul-l.qtyInv})).filter(x=>x.q>0);
  if(!inv.length){toast('No fulfilled, uninvoiced quantities to bill','warn');if(auto)orderDetail(curOrder);return;}
  openModal(`<div class="mhead"><h3>Create invoice from ${o.no}</h3><span class="x" onclick="closeModal()">&times;</span></div><div class="mbody">Invoicing the fulfilled, not-yet-invoiced quantities:<div style="overflow-x:auto"><table class="tbl" style="margin-top:10px"><tr><th>Item</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Line</th></tr>${inv.map(x=>`<tr><td>${esc(x.l.name)}</td><td class="num">${x.q}</td><td class="num">${money(x.l.price)}</td><td class="num">${money(x.q*x.l.price)}</td></tr>`).join('')}</table></div><div class="hint" style="font-size:12px;color:var(--slate);margin-top:8px">Remaining and backordered quantities stay open on the order for a later invoice.</div></div><div class="mfoot"><button class="btn ghost" onclick="closeModal();orderDetail(curOrder)">Cancel</button><button class="btn teal" onclick="doCreateOrderInvoice()">Create Invoice</button></div>`,'wide');
}
function doCreateOrderInvoice(){const o=ORDERS[curOrder];const c=custById(o.custId);const no='INV-'+(5010+INVOICES.length);const lines=[];
  o.lines.forEach(l=>{const q=l.qtyFul-l.qtyInv;if(q>0){lines.push({upc:l.upc,name:l.name,qty:q,price:l.price,disc:0,tax:+(q*l.price*0.0825).toFixed(2),fulRef:o.fulfillments.length?o.fulfillments[o.fulfillments.length-1].fno:'—'});l.qtyInv+=q;}});
  INVOICES.unshift({no,order:o.no,custId:o.custId,cust:o.cust,poRef:o.poRef,date:'2026-09-11',due:'2026-10-11',terms:c?c.terms:'Net 30',istatus:'Open',pay:'Unpaid',edi:'Not Sent',shipping:0,payments:0,credit:0,lines});
  recalcInv(o);o.timeline.push({when:'2026-09-11',who:'Amir M.',text:'Invoice '+no+' created for fulfilled quantities.'});
  closeModal();toast(no+' created','ok');nav('invoices');
}

/* ---- INVOICES (accounts receivable) ---- */
function invTotals(v){const sub=v.lines.reduce((s,l)=>s+l.qty*l.price,0);const disc=v.lines.reduce((s,l)=>s+(l.disc||0),0);const tax=v.lines.reduce((s,l)=>s+(l.tax||0),0);const ship=v.shipping||0;const total=sub-disc+tax+ship;const paid=v.payments||0;const credit=v.credit||0;return {sub,disc,tax,ship,total,paid,credit,balance:total-paid-credit};}
function recalcPay(v){const t=invTotals(v);if(t.balance<=0.001){v.pay='Paid';if(v.istatus!=='Void'&&v.istatus!=='Credited')v.istatus='Paid';}else if(t.paid>0||t.credit>0){v.pay='Partially Paid';}else{v.pay='Unpaid';}}
let invFilters={q:'',istatus:'',pay:'',edi:''};
RENDER.invoices=()=>{
  host().innerHTML=`
  <div class="phead"><div><h1>Invoices</h1><div class="sub">Accounts receivable — billing, payments and EDI</div></div>
    <div class="acts"><button class="btn ghost sm" onclick="toast('Send statements (prototype)')">Send Statements</button><button class="btn ghost sm" onclick="exportCSV('invoices')">Export to Excel</button><button class="btn teal" onclick="toast('Create invoice: open an order and use Create Invoice')">+ Create Invoice</button></div></div>
  <div class="toolbar">
    <div class="search">${SICON}<input id="iq" placeholder="Invoice, order, customer, PO, EDI ref…" value="${invFilters.q}"></div>
    <select class="sel" id="iis"><option value="">Any invoice status</option>${['Draft','Open','Sent','Partially Paid','Paid','Overdue','Void','Credited'].map(s=>`<option ${invFilters.istatus===s?'selected':''}>${s}</option>`).join('')}</select>
    <select class="sel" id="ipay"><option value="">Any payment</option>${['Unpaid','Partially Paid','Paid','Overdue','Refunded'].map(s=>`<option ${invFilters.pay===s?'selected':''}>${s}</option>`).join('')}</select>
    <select class="sel" id="iedi"><option value="">Any EDI status</option>${['Not Sent','Queued','Sent','Delivered','Failed'].map(s=>`<option ${invFilters.edi===s?'selected':''}>${s}</option>`).join('')}</select>
  </div>
  <div class="card"><div style="overflow-x:auto"><table class="tbl" id="inv_tbl"></table></div></div>`;
  ['iq','iis','ipay','iedi'].forEach(id=>$('#'+id).addEventListener('input',()=>{invFilters={q:$('#iq').value,istatus:$('#iis').value,pay:$('#ipay').value,edi:$('#iedi').value};drawInvoices();}));
  drawInvoices();
};
function drawInvoices(){
  const rows=INVOICES.filter(v=>{
    if(invFilters.q){const q=invFilters.q.toLowerCase();if(!((v.no+' '+v.order+' '+v.cust+' '+(v.poRef||'')).toLowerCase().includes(q)))return false;}
    if(invFilters.istatus&&v.istatus!==invFilters.istatus)return false;
    if(invFilters.pay&&v.pay!==invFilters.pay)return false;
    if(invFilters.edi&&v.edi!==invFilters.edi)return false;
    return true;});
  $('#inv_tbl').innerHTML=`<tr><th>Invoice</th><th>Customer</th><th>Order</th><th>Cust PO</th><th>Date</th><th>Due</th><th class="num">Total</th><th class="num">Balance</th><th>Invoice</th><th>Payment</th><th>EDI</th><th>Action</th></tr>`+
  (rows.length?rows.map(v=>{const gi=INVOICES.indexOf(v);const t=invTotals(v);return `<tr><td><b>${v.no}</b></td><td>${esc(v.cust)}</td><td class="sub">${v.order}</td><td class="sub">${esc(v.poRef||'—')}</td><td class="sub">${v.date}</td><td class="sub">${v.due}</td><td class="num">${money(t.total)}</td><td class="num ${t.balance>0?'neg':''}">${money(t.balance)}</td><td>${statusPill(v.istatus)}</td><td>${statusPill(v.pay)}</td><td>${statusPill(v.edi)}</td><td><button class="btn ghost sm" onclick="invoiceDetail(${gi})">Open</button></td></tr>`;}).join(''):`<tr><td colspan="12" style="text-align:center;color:var(--slate);padding:30px">No invoices match.</td></tr>`);
}
let curInv=null;
function invoiceDetail(i){curInv=i;const v=INVOICES[i];const c=custById(v.custId);const locked=['Paid','Void','Credited'].includes(v.istatus);
  host().innerHTML=`
  <div class="phead"><div><h1>Invoice ${v.no}</h1>
    <div class="sub">Linked order ${v.order} · ${esc(v.cust)} · issued ${v.date} · due ${v.due} · ${v.terms}</div>
    <div class="statgrp" style="margin-top:10px">${statusPill(v.istatus)} ${statusPill(v.pay)} ${statusPill(v.edi)}</div></div>
    <div class="acts">
      <button class="btn ghost" onclick="nav('invoices')">Back</button>
      <button class="btn ghost" onclick="sendInvoice()">Send Invoice</button>
      <button class="btn ghost" onclick="sendEdi()">Send EDI</button>
      <button class="btn ghost" onclick="exportInvoice()">Export</button>
      <button class="btn ghost" onclick="window.print()">Print</button>
      <button class="btn amber" onclick="recordPayment()">Record Payment</button>
      <button class="btn teal" onclick="toast('Invoice saved','ok')">Save Changes</button>
    </div></div>
  ${c&&(c.status==='On Hold'||c.balance>c.creditLimit)?`<div class="warnbar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 4l9 15H3z" stroke="#C0392B" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 10v4" stroke="#C0392B" stroke-width="1.7" stroke-linecap="round"/></svg><div><b>Credit warning.</b> ${esc(v.cust)} ${c.status==='On Hold'?'is on hold':'is over its credit limit'} (${money(c.balance)} of ${money(c.creditLimit)}). Review before sending.</div></div>`:''}
  <div class="twocol">
    <div>
      <div class="card"><div class="ch">Line items ${locked?'<span class="sub">Invoice finalised — line editing locked</span>':`<button class="btn ghost sm" onclick="addInvItem()">+ Add item</button>`}</div>
        <div style="overflow-x:auto"><table class="tbl" id="iv_tbl"></table></div></div>
      <div class="card" style="padding:16px;margin-top:16px"><div class="fsect">Invoice notes</div><textarea rows="2" style="width:100%;border:1px solid var(--border);border-radius:9px;padding:10px;font-family:inherit;font-size:12.5px" placeholder="Notes shown on the invoice document"></textarea></div>
    </div>
    <div>
      <div class="card" style="padding:16px;margin-bottom:16px"><div class="fsect">Bill to / Ship to</div>
        ${c?`<div class="acctbox"><b>${esc(c.name)}</b> · ${c.acct}<br>${esc(c.contact)} · ${c.phone}<br><span class="lbl">Bill:</span> ${esc(c.bill).replace(/\n/g,', ')}<br><span class="lbl">Ship:</span> ${esc(c.ship).replace(/\n/g,', ')}<br><span class="lbl">Cust PO:</span> ${esc(v.poRef||'—')}${c.taxExempt?'<br><span class="lbl">Tax status:</span> Tax-exempt':''}</div>`:`<div class="acctbox"><b>${esc(v.cust)}</b></div>`}
      </div>
      <div class="card" style="padding:16px"><div class="fsect">Financial summary</div><div id="iv_tot"></div></div>
    </div>
  </div>`;
  drawInvoice();
}
function drawInvoice(){const v=INVOICES[curInv];const locked=['Paid','Void','Credited'].includes(v.istatus);
  $('#iv_tbl').innerHTML=`<tr><th>UPC</th><th>Item</th><th class="num">Qty Inv.</th><th class="num">Unit Price</th><th class="num">Disc</th><th class="num">Tax</th><th class="num">Line Total</th><th>Ful. Ref</th><th></th></tr>`+
  v.lines.map((l,i)=>{const lt=l.qty*l.price-l.disc+(l.tax||0);const ro=locked?'readonly style="width:56px;background:#F4F6F7"':'style="width:56px"';return `<tr><td class="mono sub">${esc(l.upc)}</td><td><b>${esc(l.name)}</b></td>
    <td class="num"><input type="number" value="${l.qty}" ${ro} oninput="INVOICES[curInv].lines[${i}].qty=parseFloat(this.value)||0;drawInvoice()"></td>
    <td class="num"><input type="number" step="0.01" value="${l.price}" ${locked?'readonly style="width:72px;background:#F4F6F7"':'style="width:72px"'} oninput="INVOICES[curInv].lines[${i}].price=parseFloat(this.value)||0;drawInvoice()"></td>
    <td class="num"><input type="number" step="0.01" value="${l.disc}" ${locked?'readonly style="width:58px;background:#F4F6F7"':'style="width:58px"'} oninput="INVOICES[curInv].lines[${i}].disc=parseFloat(this.value)||0;drawInvoice()"></td>
    <td class="num sub">${money(l.tax||0)}</td><td class="num">${money(lt)}</td><td class="sub">${esc(l.fulRef||'—')}</td>
    <td>${locked?'':'<span class="iconbtn" onclick="INVOICES[curInv].lines.splice('+i+',1);drawInvoice()">'+XICON+'</span>'}</td></tr>`;}).join('');
  const t=invTotals(v);
  $('#iv_tot').innerHTML=`<div class="sumrow"><span class="lbl">Merchandise subtotal</span><b>${money(t.sub)}</b></div>
  <div class="sumrow"><span class="lbl">Discounts</span><b>−${money(t.disc)}</b></div>
  <div class="sumrow"><span class="lbl">Shipping / delivery</span><b>${money(t.ship)}</b></div>
  <div class="sumrow"><span class="lbl">Tax</span><b>${money(t.tax)}</b></div>
  <div class="sumrow big"><span>Invoice total</span><span>${money(t.total)}</span></div>
  <div class="sumrow" style="margin-top:10px"><span class="lbl">Payments received</span><b>−${money(t.paid)}</b></div>
  <div class="sumrow"><span class="lbl">Credit applied</span><b>−${money(t.credit)}</b></div>
  <div class="sumrow big"><span>Balance due</span><span>${money(t.balance)}</span></div>`;
}
function sendInvoice(){const v=INVOICES[curInv];if(['Draft','Open'].includes(v.istatus)){v.istatus='Sent';toast('Invoice '+v.no+' marked as sent','ok');}else{toast('Invoice already '+v.istatus.toLowerCase());}invoiceDetail(curInv);}
function recordPayment(){const v=INVOICES[curInv];const t=invTotals(v);openModal(`<div class="mhead"><h3>Record payment — ${v.no}</h3><span class="x" onclick="closeModal()">&times;</span></div><div class="mbody"><div class="grid2"><div class="fld"><label>Amount</label><input id="pay_amt" type="number" step="0.01" value="${t.balance.toFixed(2)}"></div><div class="fld"><label>Method</label><select><option>Bank transfer</option><option>Cash</option><option>Cheque</option><option>Card</option></select></div></div><div class="hint" style="font-size:12px;color:var(--slate)">Balance due is ${money(t.balance)}. Partial payments set the invoice to Partially Paid.</div></div><div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn teal" onclick="doRecordPayment()">Record Payment</button></div>`,'slim');}
function doRecordPayment(){const amt=parseFloat($('#pay_amt').value)||0;const v=INVOICES[curInv];v.payments=(v.payments||0)+amt;recalcPay(v);closeModal();toast('Payment of '+money(amt)+' recorded','ok');invoiceDetail(curInv);}
function addInvItem(){openModal('<div class="mhead"><h3>Add item to invoice</h3><span class="x" onclick="closeModal()">&times;</span></div><div class="mbody"><div class="search" style="margin-bottom:12px">'+SICON+'<input id="ii_q" placeholder="Search catalog" oninput="drawAddInv()"></div><div style="max-height:340px;overflow:auto"><table class="tbl" id="ii_tbl"></table></div></div>','wide');drawAddInv();}
function drawAddInv(){const q=($('#ii_q').value||'').toLowerCase();const rows=ITEMS.filter(it=>it.status!=='Draft'&&(!q||(it.name+' '+it.upc).toLowerCase().includes(q))).slice(0,20);$('#ii_tbl').innerHTML='<tr><th>Item</th><th>UPC</th><th class="num">Price</th><th></th></tr>'+rows.map(it=>{const gi=ITEMS.indexOf(it);return '<tr><td><b>'+esc(it.name)+'</b></td><td class="mono sub">'+esc(it.upc)+'</td><td class="num">'+money(it.price)+'</td><td><button class="btn ghost sm" onclick="addInvLine('+gi+')">Add</button></td></tr>';}).join('');}
function addInvLine(gi){const it=ITEMS[gi];INVOICES[curInv].lines.push({upc:it.upc,name:it.name,qty:1,price:it.price,disc:0,tax:+(it.price*0.0825).toFixed(2),fulRef:'manual'});closeModal();toast(it.name+' added','ok');invoiceDetail(curInv);}
function sendEdi(){const v=INVOICES[curInv];openModal(`<div class="mhead"><h3>Send EDI document</h3><span class="x" onclick="closeModal()">&times;</span></div><div class="mbody">
  <div class="fld"><label>Destination (customer EDI account)</label><input class="readonly" readonly value="${esc(v.cust)} · EDI ID 8894112"></div>
  <div class="fld"><label>Document type</label><input class="readonly" readonly value="Invoice 810"></div>
  <div class="hint" style="color:var(--slate);font-size:12px">Prototype only — no live EDI transmission is performed.</div>
  </div><div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn teal" onclick="doSendEdi()">Send Invoice 810</button></div>`,'slim');}
function doSendEdi(){const v=INVOICES[curInv];v.edi='Sent';closeModal();toast('EDI 810 sent to '+v.cust,'ok');invoiceDetail(curInv);}
function exportInvoice(){const v=INVOICES[curInv];const rows=[['UPC','Item','Qty','Unit Price','Discount','Tax','Line Total','Fulfillment Ref']];v.lines.forEach(l=>rows.push([l.upc,l.name,l.qty,l.price,l.disc,l.tax,(l.qty*l.price-l.disc+(l.tax||0)).toFixed(2),l.fulRef||'']));csvDownload(v.no+'.csv',rows);toast('Invoice exported to CSV','ok');}

let custFilters={q:'',status:'',type:'',rep:'',credit:''};
RENDER.customers=()=>{
  const reps=[...new Set(CUSTOMERS.map(c=>c.rep).filter(r=>r&&r!=='—'))];
  host().innerHTML=`
  <div class="phead"><div><h1>Customers</h1><div class="sub">Account management — orders, invoices, credit and payments</div></div>
    <div class="acts"><button class="btn ghost sm" onclick="exportCSV('customers')">Export to Excel</button><button class="btn teal" onclick="addCustomer()">+ Add Customer</button></div></div>

    <select class="sel" id="ccr"><option value="">Any credit</option>${['Good','Watch','Hold','N/A'].map(t=>`<option ${custFilters.credit===t?'selected':''}>${t}</option>`).join('')}</select>

  $('#cq').addEventListener('input',()=>{custFilters.q=$('#cq').value;drawCustomers();});
  ['cty','crep','ccr'].forEach(id=>$('#'+id).addEventListener('change',()=>{custFilters.type=$('#cty').value;custFilters.rep=$('#crep').value;custFilters.credit=$('#ccr').value;drawCustomers();}));
  drawCustomers();
};
function drawCustomers(){
  const rows=CUSTOMERS.filter(c=>{
    if(custFilters.status&&c.status!==custFilters.status)return false;
    if(custFilters.type&&c.type!==custFilters.type)return false;
    if(custFilters.rep&&c.rep!==custFilters.rep)return false;
    if(custFilters.credit&&c.credit!==custFilters.credit)return false;
    if(custFilters.q){const q=custFilters.q.toLowerCase();if(!((c.name+' '+c.contact+' '+c.phone+' '+c.email+' '+c.acct).toLowerCase().includes(q)))return false;}
    return true;});
  $('#cust_tbl').innerHTML=`<tr><th>Customer</th><th>Account #</th><th>Contact</th><th>Phone</th><th>Email</th><th>Type</th><th>Terms</th><th>Credit</th><th>Status</th><th class="num">Open Balance</th><th>Last Order</th><th>Action</th></tr>`+
  (rows.length?rows.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td class="sub">${c.acct}</td><td>${esc(c.contact)}</td><td class="sub">${c.phone}</td><td class="sub">${esc(c.email)}</td><td>${c.type}</td><td class="sub">${c.terms}</td><td>${statusPill(c.credit)}</td><td>${statusPill(c.status)}</td><td class="num ${c.balance>0?'neg':''}">${money(c.balance)}</td><td class="sub">${c.last}</td><td><button class="btn ghost sm" onclick="customerDetail('${c.id}')">View</button></td></tr>`).join(''):`<tr><td colspan="12" style="text-align:center;color:var(--slate);padding:30px">No customers match.</td></tr>`);
}
function customerDetail(id){const c=custById(id);if(!c){toast('Customer not found','warn');return;}
  const ords=ORDERS.filter(o=>o.custId===id);const invs=INVOICES.filter(v=>v.custId===id);const openInv=invs.filter(v=>invTotals(v).balance>0.001);
  host().innerHTML=`
  <div class="phead"><div><h1>${esc(c.name)}</h1><div class="sub">${c.acct} · ${c.type} · rep ${esc(c.rep)}</div>
    <div class="statgrp" style="margin-top:10px">${statusPill(c.status)} ${statusPill(c.credit)} <span class="pill p-info">${c.terms}</span></div></div>
    <div class="acts"><button class="btn ghost" onclick="nav('customers')">Back</button><button class="btn ghost" onclick="toast('Place order (prototype)')">Place Order</button>${c.status==='On Hold'?`<button class="btn ghost" onclick="setHold('${id}',false)">Activate</button>`:`<button class="btn ghost" onclick="setHold('${id}',true)">Put on Hold</button>`}<button class="btn teal" onclick="addCustomer('${id}')">Edit</button></div></div>
  ${c.status==='Pending Approval'?`<div class="warnbar" style="background:#FBEEDD;border-color:#F0DCC0;color:#7a5410"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#C77700" stroke-width="1.6"/><path d="M12 8v5" stroke="#C77700" stroke-width="1.7" stroke-linecap="round"/></svg><div><b>Pending approval.</b> This customer signed up through the app and is awaiting review. <span style="text-decoration:underline;cursor:pointer" onclick="approveCust('${id}')">Approve now</span></div></div>`:''}
  <div class="twocol">
    <div>
      <div class="card" style="padding:16px;margin-bottom:16px"><div class="fsect">Account details</div>
        <div class="kv"><div class="k">Primary contact</div><div>${esc(c.contact)}</div><div class="k">Phone</div><div>${c.phone}</div><div class="k">Email</div><div>${esc(c.email)}</div><div class="k">Billing address</div><div>${esc(c.bill).replace(/\n/g,', ')}</div><div class="k">Shipping address</div><div>${esc(c.ship).replace(/\n/g,', ')}</div><div class="k">Payment terms</div><div>${c.terms}</div><div class="k">Credit limit</div><div>${money(c.creditLimit)}</div><div class="k">Current balance</div><div>${money(c.balance)}</div><div class="k">Tax status</div><div>${c.taxExempt?'Tax-exempt':'Taxable'}</div><div class="k">Sales rep</div><div>${esc(c.rep)}</div></div>
        ${c.notes?`<div class="fsect" style="margin-top:14px">Notes</div><div class="sub" style="font-size:12.5px">${esc(c.notes)}</div>`:''}</div>
      <div class="card"><div class="ch">Order history</div><div style="overflow-x:auto"><table class="tbl"><tr><th>Order</th><th>Date</th><th class="num">Total</th><th>Fulfillment</th><th>Invoice</th><th>Payment</th></tr>${ords.length?ords.map(o=>{const gi=ORDERS.indexOf(o);return `<tr><td><b style="cursor:pointer;text-decoration:underline" onclick="orderDetail(${gi})">${o.no}</b></td><td class="sub">${o.date}</td><td class="num">${money(orderTotals(o).total)}</td><td>${statusPill(o.fstatus)}</td><td>${statusPill(o.istatus)}</td><td>${statusPill(o.pay)}</td></tr>`;}).join(''):'<tr><td colspan="6" class="sub" style="padding:16px;text-align:center">No orders yet.</td></tr>'}</table></div></div>
    </div>
    <div>
      <div class="card" style="padding:16px;margin-bottom:16px"><div class="fsect">Open invoices</div>${openInv.length?openInv.map(v=>`<div class="sumrow"><span>${v.no} <span class="sub">due ${v.due}</span></span><b class="neg">${money(invTotals(v).balance)}</b></div>`).join(''):'<div class="sub" style="font-size:12.5px">No open invoices.</div>'}<div class="sumrow big" style="margin-top:6px"><span>Total outstanding</span><span>${money(openInv.reduce((s,v)=>s+invTotals(v).balance,0))}</span></div></div>
      <div class="card" style="padding:16px;margin-bottom:16px"><div class="fsect">Invoice history</div>${invs.length?invs.map(v=>{const gi=INVOICES.indexOf(v);return `<div class="sumrow"><span style="cursor:pointer;text-decoration:underline" onclick="invoiceDetail(${gi})">${v.no}</span><span>${statusPill(v.pay)}</span></div>`;}).join(''):'<div class="sub" style="font-size:12.5px">No invoices.</div>'}</div>
      <div class="card" style="padding:16px;margin-bottom:16px"><div class="fsect">Recent payments</div><div class="sub" style="font-size:12.5px">${invs.filter(v=>v.payments>0).length?invs.filter(v=>v.payments>0).map(v=>`<div class="sumrow"><span>${v.no}</span><b>${money(v.payments)}</b></div>`).join(''):'No payments recorded.'}</div></div>
      <div class="card" style="padding:16px"><div class="fsect">Account activity</div><div class="tline"><div class="ev"><div class="tx">Account opened in admin.</div><div class="mt">2026-09-11 · Amir M.</div></div><div class="ev"><div class="tx">Most recent order ${ords[0]?ords[0].no:'—'}.</div><div class="mt">${c.last} · Sales</div></div><div class="ev"><div class="tx">Account created.</div><div class="mt">— · System</div></div></div></div>
    </div>
  </div>`;
}
function setHold(id,hold){const c=custById(id);c.status=hold?'On Hold':'Active';if(hold)c.credit='Hold';else if(c.credit==='Hold')c.credit='Watch';toast(hold?'Account placed on hold':'Account activated','ok');customerDetail(id);}
function approveCust(id){const c=custById(id);c.status='Active';c.credit='Good';toast(c.name+' approved','ok');customerDetail(id);}
function addCustomer(id){const c=id?custById(id):null;openModal(`<div class="mhead"><h3>${c?'Edit':'Add'} Customer</h3><span class="x" onclick="closeModal()">&times;</span></div><div class="mbody">
  <div class="fgrid"><div class="fld"><label>Business name <span class="req">*</span></label><input id="c_name" value="${c?esc(c.name):''}"></div><div class="fld"><label>Account #</label><input id="c_acct" value="${c?c.acct:'ACC-'+(10400+CUSTOMERS.length)}"></div></div>
  <div class="fgrid"><div class="fld"><label>Primary contact</label><input id="c_contact" value="${c?esc(c.contact):''}"></div><div class="fld"><label>Phone</label><input id="c_phone" value="${c?c.phone:''}"></div></div>
  <div class="fgrid"><div class="fld"><label>Email</label><input id="c_email" value="${c?esc(c.email):''}"></div><div class="fld"><label>Type</label><select id="c_type">${['Retail','Wholesale','Restaurant','Grocery','Distributor','Other'].map(t=>`<option ${c&&c.type===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
  <div class="fgrid"><div class="fld"><label>Payment terms</label><select id="c_terms">${['Net 15','Net 30','Net 45','Due on receipt'].map(t=>`<option ${c&&c.terms===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="fld"><label>Credit limit</label><input id="c_cl" type="number" value="${c?c.creditLimit:5000}"></div></div>
  <div class="fld"><label>Billing address</label><input id="c_bill" value="${c?esc(c.bill).replace(/\n/g,', '):''}"></div>
  <div class="fld"><label>Shipping address</label><input id="c_ship" value="${c?esc(c.ship).replace(/\n/g,', '):''}"></div>
  <div class="fld"><label>Notes</label><textarea id="c_notes" rows="2">${c?esc(c.notes):''}</textarea></div>
  </div><div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn teal" onclick="saveCustomer('${id||''}')">Save Customer</button></div>`,'wide');}
function saveCustomer(id){const n=$('#c_name').value.trim();if(!n){toast('Business name required','warn');return;}
  const data={name:n,acct:$('#c_acct').value,contact:$('#c_contact').value||'—',phone:$('#c_phone').value||'—',email:$('#c_email').value||'—',type:$('#c_type').value,terms:$('#c_terms').value,creditLimit:parseFloat($('#c_cl').value)||0,bill:$('#c_bill').value,ship:$('#c_ship').value,notes:$('#c_notes').value};
  if(id){Object.assign(custById(id),data);toast('Customer updated','ok');closeModal();customerDetail(id);}
  else{const nid='C-'+(2007+CUSTOMERS.length);CUSTOMERS.unshift(Object.assign({id:nid,credit:'N/A',status:'Pending Approval',balance:0,taxExempt:false,rep:'—',last:'—'},data));toast('Customer added (pending approval)','ok');closeModal();nav('customers');}
}

let userFilters={q:'',role:'',status:''};
RENDER.users=()=>{
  host().innerHTML=`
  <div class="phead"><div><h1>Users</h1><div class="sub">Team members, roles and permissions</div></div>
    <div class="acts"><button class="btn ghost sm" onclick="exportCSV('users')">Export</button><button class="btn teal" onclick="userModal()">+ Create User</button></div></div>

    <div class="search">${SICON}<input id="uq" placeholder="Name, email, role, status" value="${userFilters.q}"></div>
    <select class="sel" id="urole"><option value="">Any role</option>${ROLES.map(r=>`<option ${userFilters.role===r?'selected':''}>${r}</option>`).join('')}</select>
    <select class="sel" id="ustat"><option value="">Any status</option><option ${userFilters.status==='Active'?'selected':''}>Active</option><option ${userFilters.status==='Inactive'?'selected':''}>Inactive</option></select>
  </div>
  <div class="card"><div style="overflow-x:auto"><table class="tbl" id="usr_tbl"></table></div></div>`;

  ['urole','ustat'].forEach(id=>$('#'+id).addEventListener('change',()=>{userFilters.role=$('#urole').value;userFilters.status=$('#ustat').value;drawUsers();}));

function drawUsers(){
  const rows=USERS.filter(u=>{
    if(userFilters.role&&u.role!==userFilters.role)return false;
    if(userFilters.status&&u.status!==userFilters.status)return false;
    if(userFilters.q){const q=userFilters.q.toLowerCase();if(!((u.first+' '+u.last+' '+u.email+' '+u.role+' '+u.status).toLowerCase().includes(q)))return false;}
    return true;});
  $('#usr_tbl').innerHTML=`<tr><th>User</th><th>Email</th><th>Role</th><th>Department</th><th>Last Login</th><th>Status</th><th>Created</th><th>Action</th></tr>`+
  rows.map(u=>{const gi=USERS.indexOf(u);return `<tr><td><b>${esc(u.first+' '+u.last)}</b></td><td class="sub">${esc(u.email)}</td><td>${u.role}</td><td class="sub">${u.dept}</td><td class="sub">${u.lastLogin}</td><td>${statusPill(u.status)}</td><td class="sub">${u.created}</td><td><button class="btn ghost sm" onclick="userModal(${gi})">Edit</button></td></tr>`;}).join('');
}
function userModal(i){const u=i!=null?USERS[i]:null;
  openModal(`<div class="mhead"><h3>${u?'Edit':'Create'} User</h3><span class="x" onclick="closeModal()">&times;</span></div><div class="mbody">
  <div class="fgrid"><div class="fld"><label>First name <span class="req">*</span></label><input id="u_first" value="${u?esc(u.first):''}"></div><div class="fld"><label>Last name</label><input id="u_last" value="${u?esc(u.last):''}"></div></div>
  <div class="fgrid"><div class="fld"><label>Email <span class="req">*</span></label><input id="u_email" value="${u?esc(u.email):''}"></div><div class="fld"><label>Phone</label><input id="u_phone" value="${u?u.phone:''}"></div></div>
  <div class="fgrid"><div class="fld"><label>Role</label><select id="u_role" onchange="document.getElementById('u_perm').textContent=ROLEPERMS[this.value]||''">${ROLES.map(r=>`<option ${u&&u.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="fld"><label>Department</label><input id="u_dept" value="${u?esc(u.dept):''}"></div></div>
  <div class="fgrid"><div class="fld"><label>Default location / warehouse</label><input id="u_loc" value="${u?esc(u.loc):'Main Warehouse'}"></div><div class="fld"><label>Status</label><select id="u_status"><option ${u&&u.status==='Active'?'selected':''}>Active</option><option ${u&&u.status==='Inactive'?'selected':''}>Inactive</option></select></div></div>
  ${u?'':'<div class="fld"><label>Access</label><select id="u_invite"><option>Send email invite</option><option>Set temporary password</option></select></div>'}

  </div><div class="mfoot">${u?`<button class="btn ghost" onclick="toast('Password reset link sent','ok')">Reset Password</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn teal" onclick="saveUser(${i!=null?i:-1})">Save User</button></div>`,'wide');
}
function saveUser(i){const f=$('#u_first').value.trim();const e=$('#u_email').value.trim();if(!f||!e){toast('Name and email required','warn');return;}
  const data={first:f,last:$('#u_last').value,email:e,phone:$('#u_phone').value||'—',role:$('#u_role').value,dept:$('#u_dept').value||'—',loc:$('#u_loc').value||'—',status:$('#u_status').value};
  if(i>=0){Object.assign(USERS[i],data);toast('User updated','ok');}
  else{USERS.unshift(Object.assign({lastLogin:'—',created:'2026-09-11'},data));toast('User created — invite sent','ok');}
  closeModal();RENDER.users();
}

/* ---- CSV EXPORT ---- */
function csvDownload(name,rows){const csv=rows.map(r=>r.map(c=>{const s=String(c==null?'':c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
function exportCSV(which){
  if(which==='catalog'){const rows=[['UPC','Item Name','Department','Size','Qty','Cost','Price','Margin %','Vendor Code','Status']];ITEMS.forEach(i=>rows.push([i.upc,i.name,i.dept,i.size,i.qty,i.cost,i.price,i.price?marginPct(i.price,i.cost).toFixed(1):'',i.vcode,i.status]));csvDownload('catalog.csv',rows);}
  else if(which==='pos'){const rows=[['PO','Vendor','Order Date','Expected','Items','Total','Status','Payment','By']];POS.forEach(p=>{const t=poTotals(p);rows.push([p.no,p.vendor,p.date,p.exp,t.items,t.total.toFixed(2),p.status,p.pay,p.by]);});csvDownload('purchase_orders.csv',rows);}
  else if(which==='orders'){const rows=[['Order','Customer','Cust PO','Order Date','Req Delivery','Rep','Items','Total','Order Status','Fulfillment','Invoice','Payment']];ORDERS.forEach(o=>{const t=orderTotals(o);rows.push([o.no,o.cust,o.poRef,o.date,o.reqDate,o.rep,t.items,t.total.toFixed(2),o.status,o.fstatus,o.istatus,o.pay]);});csvDownload('orders.csv',rows);}
  else if(which==='invoices'){const rows=[['Invoice','Customer','Order','Cust PO','Date','Due','Total','Balance','Invoice Status','Payment','EDI']];INVOICES.forEach(v=>{const t=invTotals(v);rows.push([v.no,v.cust,v.order,v.poRef,v.date,v.due,t.total.toFixed(2),t.balance.toFixed(2),v.istatus,v.pay,v.edi]);});csvDownload('invoices.csv',rows);}
  else if(which==='customers'){const rows=[['Customer','Account','Contact','Phone','Email','Type','Terms','Credit','Status','Open Balance','Credit Limit','Rep','Last Order']];CUSTOMERS.forEach(c=>rows.push([c.name,c.acct,c.contact,c.phone,c.email,c.type,c.terms,c.credit,c.status,c.balance.toFixed(2),c.creditLimit,c.rep,c.last]));csvDownload('customers.csv',rows);}
  else if(which==='users'){const rows=[['First','Last','Email','Phone','Role','Department','Location','Last Login','Status','Created']];USERS.forEach(u=>rows.push([u.first,u.last,u.email,u.phone,u.role,u.dept,u.loc,u.lastLogin,u.status,u.created]));csvDownload('users.csv',rows);}
  toast('Exported to CSV','ok');
}
